[build-system]
requires = ["setuptools==69.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanroom-backend"
version = "0.1.0"
description = "Deterministic repository reproducibility auditor"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "pydantic==2.10.5",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
